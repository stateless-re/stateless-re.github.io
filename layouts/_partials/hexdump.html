{{- /* `hexdump -C` of a zeroed 4 KiB page that holds only the name.
       Two widths: 16 bytes a row, and 8 for narrow screens. */ -}}
{{- $bytes := slice "73" "74" "61" "74" "65" "6c" "65" "73" "73" -}}
{{- $chars := split "stateless" "" -}}
<figure class="dump" aria-label="Hex dump of a page of memory. It holds the word stateless and a null byte; everything after that is zero.">
{{- range $w := slice 16 8 }}
  <pre class="w{{ $w }}" aria-hidden="true">
    {{- range $r := seq 0 (div 16 $w) -}}
      {{- $base := mul $r $w -}}
      <span class="off">{{ printf "%08x" $base }}</span>{{ "  " -}}
      {{- range $j := seq 0 (sub $w 1) -}}
        {{- $i := add $base $j -}}
        {{- if eq $j 8 }}{{ " " }}{{ end -}}
        {{- if lt $i 9 -}}
          <span class="b w" data-i="{{ $i }}" style="--n:{{ $i }}">{{ index $bytes $i }}</span>
        {{- else if eq $i 9 -}}
          <span class="b" data-i="9">00</span>
        {{- else -}}
          00
        {{- end -}}
        {{- " " -}}
      {{- end -}}
      {{- " |" -}}
      {{- range $j := seq 0 (sub $w 1) -}}
        {{- $i := add $base $j -}}
        {{- if lt $i 9 -}}
          <span class="c w" data-i="{{ $i }}" style="--n:{{ $i }}">{{ index $chars $i }}</span>
        {{- else if eq $i 9 -}}
          <span class="c" data-i="9">.</span>
        {{- else -}}
          .
        {{- end -}}
      {{- end -}}
      {{- "|\n" -}}
    {{- end -}}
    {{- "*\n" -}}
    <span class="off">00001000</span></pre>
{{- end }}
</figure>
