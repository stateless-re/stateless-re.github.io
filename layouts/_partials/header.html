<header class="site-header">
  <a class="wordmark" href="{{ site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>stateless</a>
  <nav aria-label="Main">
    {{ $current := . }}
    {{ range site.Menus.main }}
      <a href="{{ .URL }}"{{ if or ($current.IsMenuCurrent "main" .) (eq $current.RelPermalink .URL) }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{ end }}
  </nav>
</header>
